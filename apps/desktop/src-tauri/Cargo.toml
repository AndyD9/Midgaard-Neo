# Coque desktop de Midgaard : une fenêtre Tauri 2 sur le dashboard du daemon.
# Elle ne contient aucune logique du harness — le daemon reste la seule source
# de vérité, et le même dashboard s'ouvre aussi dans un navigateur. Construite
# depuis le clone (`npm run desktop:build`), ou en bundle autonome qui embarque
# Node, le daemon et le dashboard (`npm run desktop:bundle`) ; non signée.
# L'application autonome se met à jour depuis les releases GitHub (`src/update.rs`).
[package]
name = "midgaard-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fenêtre desktop du dashboard Midgaard"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# La page chargée est le dashboard du daemon, servi en HTTP local, et elle ne
# reçoit aucune capacité Tauri (voir tauri.conf.json) : les deux plugins
# ci-dessous ne servent qu'à la coque, en Rust (`src/update.rs`).
tauri = { version = "2.12.5", features = [] }
serde_json = "1.0.154"
# Pour l'exécutable unique seulement (`portable`) : déplier l'arbre embarqué.
tar = { version = "0.4", optional = true }
flate2 = { version = "1.1", optional = true }
# Mise à jour depuis les releases GitHub : manifeste, téléchargement, signature
# vérifiée (minisign), installation du bundle.
tauri-plugin-updater = "2.14.1"
# Le dialogue natif « une version est disponible », ouvert par la coque.
tauri-plugin-dialog = "2.8.4"

[features]
# Le mode « production » de Tauri : le dossier `ui/` est embarqué, et rien
# n'attend un serveur de développement. La CLI de Tauri l'active d'elle-même ;
# ici on construit par `cargo`, d'où le défaut.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# L'exécutable unique : l'arbre embarqué (`runtime/`) voyage **dans** le
# binaire, en archive, et se déplie au premier lancement dans le dossier de
# données de l'application. `build.rs` exige alors `runtime.tar.gz`, produit
# par `apps/desktop/scripts/portable.mjs`.
portable = ["dep:tar", "dep:flate2"]

[profile.release]
strip = true
lto = true
codegen-units = 1

# Les macros procédurales sont des bibliothèques que rustc charge pendant la
# compilation. Dépouillées (`strip`), elles ne se chargent plus sous macOS 27
# (« mis-aligned LINKEDIT string pool » au dlopen), et toute la compilation
# release échoue sur « can't find crate ». Elles ne sont pas dans le binaire
# livré : les dépouiller ne gagnait rien.
[profile.release.build-override]
strip = false
